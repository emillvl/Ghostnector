[package]
name = "ghostnector-appd"
description = "The APP-scope namespace helper. Creates dead-end namespaces and verifies their effective policy; it does nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "ghostnector_appd"
path = "src/lib.rs"

[[bin]]
name = "ghostnector-appd"
path = "src/main.rs"

[[bin]]
name = "ghostnector-appd-launch"
path = "src/bin/launch.rs"

[[bin]]
name = "ghostnector-appd-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "ghostnector-appd-relay"
path = "src/bin/relay.rs"

[dependencies]
ghostnector-spec = { path = "../ghostnector-spec" }
ghostnector-policy = { path = "../ghostnector-policy" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
nix = { workspace = true, features = ["mount", "signal"] }
caps = { workspace = true }
