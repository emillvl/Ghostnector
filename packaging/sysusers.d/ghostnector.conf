# system users for Ghostnector
#
# Static uids, deliberately: the policy is expressed in uids, so a service whose uid moved would
# silently stop matching its own rules. The helper refuses to start if the uid it resolves does not
# match its configuration for the same reason.

u ghostnector      - "Ghostnector control plane" /var/lib/ghostnector /usr/sbin/nologin
u ghostnector-netd - "Ghostnector privileged helper" /nonexistent /usr/sbin/nologin
