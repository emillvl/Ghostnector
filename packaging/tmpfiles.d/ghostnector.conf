# runtime directories for Ghostnector
#
# The helper and the control plane share this directory, because the control plane's socket and the
# helper's socket live side by side and a systemd per-service RuntimeDirectory would give each of
# them a different one. Both daemons set the mode and owner of the socket they create themselves.
#
# The main directory is owned by the control plane's service account so the unprivileged control
# plane can create `core.sock`; its group (which may connect to the sockets) has no write permission,
# so it cannot replace them. The privileged helper runs as root but deliberately without
# CAP_DAC_OVERRIDE, so it gets its own root-owned subdirectory for `netd.sock` (mode 0755: owner-only
# write, and the client's trust check accepts it).
#
# `apps` holds the namespace helper's registry and one directory per isolation group. It is root-
# owned and private: the group files inside it are the resolver configuration the launcher
# bind-mounts, and nothing else on the machine needs to read them.
#
# `/run/netns` is where the kernel's named network namespaces appear (`ip netns`). The namespace
# helper needs it in `ReadWritePaths`, and systemd refuses to set up a unit's mount namespace when
# a listed path does not exist — on a fresh boot nothing else creates this directory, so without
# this entry the helper fails at every start with status 226/NAMESPACE (D-33).
#
# Path mode owner group age

d /run/ghostnector 0755 ghostnector ghostnector -
d /run/ghostnector/netd 0755 root root -
d /run/ghostnector/apps 0700 root root -
d /run/netns 0755 root root -
# Tor writes its control cookie here; the setgid group is how the unprivileged control plane reads
# it (Tor's `CookieAuthFileGroupReadable` makes the file 0640, and the inherited group is this one).
d /run/ghostnector-tor 2750 debian-tor ghostnector -
